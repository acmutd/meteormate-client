Looking at the logs more carefully, I see the problem. The `repository_dispatch` event isn't passing the `client_payload` correctly. Look here:

```
2026-01-30T20:42:33.8990995Z [36;1mif [ "repository_dispatch" = "repository_dispatch" ]; then[0m
2026-01-30T20:42:33.8991651Z [36;1m  BRANCH=""[0m
```

The branch is empty string `""` because `${{ github.event.client_payload.branch }}` is empty.

This means the **backend dispatch isn't sending the payload correctly**.

---

## Fix the Backend Workflow

The issue is likely the JSON escaping. Let's use `gh` CLI instead which handles this better:

### Backend: `.github/workflows/notify-parent.yml`

```yaml
name: Notify parent repo

on:
  push:
    branches: [main, dev]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch subtree update event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Dispatching for branch: $BRANCH_NAME"
          
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/acmutd/meteormate-client/dispatches \
            -f event_type="subtree-updated" \
            -f client_payload[branch]="$BRANCH_NAME"
```

The `gh` CLI handles JSON encoding properly and is already available on GitHub runners.

---

**Or if you prefer curl**, the issue might be quote escaping. Try this:

```yaml
name: Notify parent repo

on:
  push:
    branches: [main, dev]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch subtree update event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Dispatching for branch: $BRANCH_NAME"
          
          JSON_PAYLOAD=$(cat <<EOF
          {
            "event_type": "subtree-updated",
            "client_payload": {
              "branch": "${BRANCH_NAME}"
            }
          }
          EOF
          )
          
          echo "Payload: $JSON_PAYLOAD"
          
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/acmutd/meteormate-client/dispatches \
            -d "$JSON_PAYLOAD"
```

I recommend the `gh` CLI version - it's cleaner and less error-prone.
