name: Update backend subtree

on:
  repository_dispatch:
    types: [subtree-updated]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-subtree:
    runs-on: ubuntu-latest

    steps:
      # Checkout frontend repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for subtree merges

      # Configure Git
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Add backend remote using the GitHub token
      - name: Setup backend remote
        run: |
          git remote remove backend || true
          git remote add backend https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/acmutd/meteormate-backend.git

      # Pull backend branch into subtree
      - name: Update backend subtree
        run: |
          # Detect current branch
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "Pulling backend $BRANCH into subtree"
          
          # Pull subtree, ignore if nothing changed
          git subtree pull --prefix=backend backend $BRANCH --squash || echo "No updates"

      # Commit changes if any
      - name: Commit and push
        run: |
          if ! git diff --quiet; then
            git add backend
            git commit -m "chore: update backend subtree from $BRANCH"
            git push origin $BRANCH
          else
            echo "No changes to commit"
