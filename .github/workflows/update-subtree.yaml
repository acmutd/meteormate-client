name: Update backend subtree

on:
  repository_dispatch:
    types: [subtree-updated]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # daily at 3am

permissions:
  contents: write

jobs:
  update-subtree:
    runs-on: ubuntu-latest

    steps:
      # Checkout frontend repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for subtree merges

      # Configure Git user
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Setup backend remote using HTTPS + token
      - name: Setup backend remote
        run: |
          git remote remove backend || true
          git remote add backend https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/acmutd/meteormate-backend.git

      # Detect branch and pull corresponding backend branch into subtree
      - name: Update backend subtree
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "Pulling backend branch $BRANCH into subtree..."
          
          # This command creates a merge commit automatically if there are updates
          git subtree pull --prefix=backend backend $BRANCH --squash --message "chore: update backend subtree from $BRANCH"

      # Push changes (with safety rebase)
      - name: Push changes
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          
          # Check if we have new commits to push
          if [ "$(git rev-list HEAD...origin/$BRANCH --count)" -gt 0 ]; then
            echo "Updates detected. Preparing to push..."
            
            # 1. Fetch latest changes from origin again
            git fetch origin $BRANCH
            
            # 2. Rebase our new subtree commit on top of the latest origin/main
            git rebase origin/$BRANCH
            
            # 3. Push
            git push origin $BRANCH
          else
            echo "No updates from backend."
          fi


