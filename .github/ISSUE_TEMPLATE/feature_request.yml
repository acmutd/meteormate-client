name: "Feature request"
description: "Suggest an improvement or new capability."
title: "feat: "
labels: [ "enhancement", "needs-triage" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What user pain does this solve?
      placeholder: "As a user, I want..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What’s the solution? Include screenshots/mock if UI.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
