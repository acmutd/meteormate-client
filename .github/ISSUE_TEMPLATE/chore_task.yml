name: "Chore / Task"
description: "Refactor, cleanup, docs, tooling, or small change."
title: "chore: "
labels: [ "chore" ]
body:
  - type: textarea
    id: work
    attributes:
      label: Work to do
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any context, links, or constraints.
    validations:
      required: false
