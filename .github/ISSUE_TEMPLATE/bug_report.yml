name: "Bug report"
description: "Something is broken or behaving incorrectly."
title: "bug: "
labels: [ "bug", "needs-triage" ]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened? What did you expect to happen?
      placeholder: Clear + specific. Include screenshots if UI.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide exact steps so someone else can reproduce.
      placeholder: |
        1) Go to ...
        2) Click ...
        3) See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: Paste relevant logs (redact secrets).
      render: shell
    validations:
      required: false

  - type: input
    id: area
    attributes:
      label: Area
      description: Frontend / API / Auth / DB / Other
      placeholder: Frontend
    validations:
      required: false
